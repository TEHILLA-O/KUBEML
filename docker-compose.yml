services:
  postgres:
    image: postgres:16.6
    environment:
      POSTGRES_USER: kubeml
      POSTGRES_PASSWORD: kubeml-local
      POSTGRES_DB: kubeml
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kubeml"]
      interval: 5s
      timeout: 3s
      retries: 20
  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: kubeml
      MINIO_ROOT_PASSWORD: kubeml-local-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio:/data
  minio-init:
    image: minio/mc:RELEASE.2024-11-21T17-21-54Z
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "mc alias set local http://minio:9000 kubeml kubeml-local-secret && mc mb -p local/kubeml || true"
  mlflow:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.mlflow
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      MLFLOW_BACKEND_STORE_URI: postgresql+psycopg2://kubeml:kubeml-local@postgres:5432/kubeml
      MLFLOW_DEFAULT_ARTIFACT_ROOT: s3://kubeml/mlflow
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: kubeml
      AWS_SECRET_ACCESS_KEY: kubeml-local-secret
    ports:
      - "5000:5000"
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri postgresql+psycopg2://kubeml:kubeml-local@postgres:5432/kubeml --default-artifact-root s3://kubeml/mlflow
  platform:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.platform
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KUBEML_DATABASE_URL: postgresql+psycopg://kubeml:kubeml-local@postgres:5432/kubeml
      MLFLOW_TRACKING_URI: http://mlflow:5000
      KUBEML_DATA_DIR: /data
      KUBEML_JWT_SECRET: local-compose-only
      KUBEML_ENVIRONMENT: local
    ports:
      - "8096:8080"
    volumes:
      - platform:/data
  serving:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.serving
    environment:
      KUBEML_MODEL_PATH: /opt/kubeml/model.json
      KUBEML_SLOT: stable
      KUBEML_DATA_DIR: /data
    ports:
      - "8090:8090"
  console:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.frontend
    depends_on:
      - platform
    ports:
      - "4173:8080"
  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/observability/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - "9090:9090"
  alertmanager:
    image: prom/alertmanager:v0.28.0
    volumes:
      - ./deploy/observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "9093:9093"
  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: kubeml-local
    volumes:
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
volumes:
  postgres:
  minio:
  platform:
