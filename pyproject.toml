[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kubeml"
version = "0.1.0"
description = "KubeML operational control plane for model training, release, and reliability."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn==0.34.0",
  "pydantic==2.10.6",
  "pydantic-settings==2.7.1",
  "scikit-learn==1.5.2",
  "pandas==2.2.3",
  "numpy==2.1.3",
  "scipy==1.14.1",
  "mlflow==2.19.0",
  "sqlalchemy==2.0.36",
  "psycopg[binary]==3.2.4",
  "prometheus-client==0.21.1",
  "httpx==0.28.1",
  "PyJWT==2.10.1",
  "python-multipart==0.0.20",
  "boto3==1.35.99",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.4",
  "ruff==0.9.6",
]

[project.scripts]
kubeml-platform = "kubeml.platform.app:main"
kubeml-serving = "kubeml.serving.app:main"
kubeml-train = "kubeml.training:main"
kubeml-retrain = "kubeml.retrain:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
