route:
  receiver: kubeml-platform
  group_by: ["alertname"]
  group_wait: 10s
  repeat_interval: 1h
receivers:
  - name: kubeml-platform
    webhook_configs:
      - url: http://platform:8080/api/v1/alerts/webhook
        send_resolved: true
        http_config:
          authorization:
            type: Bearer
            credentials: local-alert-token
