groups:
  - name: kubeml
    rules:
      - alert: InferenceErrorRateHigh
        expr: sum(rate(kubeml_inference_errors_total[5m])) / clamp_min(sum(rate(kubeml_inference_requests_total[5m])), 0.001) > 0.05
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Inference error rate is above 5% for two minutes.
      - alert: InferenceLatencyHigh
        expr: histogram_quantile(0.95, sum by (le) (rate(kubeml_inference_duration_seconds_bucket[5m]))) > 0.75
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Inference p95 latency is above the local policy ceiling.
      - alert: ModelNotLoaded
        expr: max(kubeml_model_loaded) == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: No KubeML model slot is loaded.
